spring:
  application:
    name: ledger-match-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ledger_match}
    username: ${DATABASE_USERNAME:ledger}
    password: ${DATABASE_PASSWORD:ledger}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
app:
  jwt-secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-bytes}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  openai-api-key: ${OPENAI_API_KEY:}